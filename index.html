<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>كمال القادري - Portfolio</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;700;900&display=swap');

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Cairo', sans-serif;
      text-align: right;
      background: #050505;
      color: #FFFFFF;
      overflow-x: hidden;
      line-height: 1.6;
    }

    body::before {
      content: '';
      position: fixed;
      width: 100%;
      height: 100%;
      background: 
        radial-gradient(circle at 20% 50%, rgba(0, 242, 254, 0.1) 0%, transparent 50%),
        radial-gradient(circle at 80% 80%, rgba(79, 172, 254, 0.1) 0%, transparent 50%);
      animation: bgPulse 20s ease infinite;
    }

    @keyframes bgPulse {
      0%, 100% { opacity: 0.5; }
      50% { opacity: 1; }
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 20px;
      position: relative;
      z-index: 1;
    }

    section {
      padding: 80px 0;
      opacity: 0;
      transform: translateY(30px);
      transition: all 0.8s ease;
    }

    section.visible {
      opacity: 1;
      transform: translateY(0);
    }

    .section-title {
      font-size: 3rem;
      font-weight: 900;
      background: linear-gradient(135deg, #00F2FE, #4FACFE);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 50px;
      text-align: center;
    }

    .card {
      background: rgba(25, 25, 25, 0.8);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      padding: 30px;
      margin: 20px 0;
      transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .card:hover {
      transform: translateY(-10px);
      border-color: rgba(0, 242, 254, 0.5);
      box-shadow: 0 20px 60px rgba(0, 242, 254, 0.3);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 24px;
      margin-top: 40px;
    }

    .btn {
      display: inline-block;
      padding: 16px 40px;
      background: linear-gradient(135deg, #00F2FE, #4FACFE);
      color: #000;
      font-weight: 700;
      border-radius: 50px;
      text-decoration: none;
      transition: all 0.3s ease;
      box-shadow: 0 10px 30px rgba(0, 242, 254, 0.4);
    }

    .btn:hover {
      transform: scale(1.05);
      box-shadow: 0 15px 40px rgba(0, 242, 254, 0.6);
    }

    @media (max-width: 768px) {
      .section-title { font-size: 2rem; }
      section { padding: 50px 0; }
      .grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- HERO SECTION -->
    <section id="hero" class="hero">
      <div class="hero-content">
        <h1 class="hero-name">كمال القادري</h1>
        <h2 class="hero-title">مهندس معلوماتية</h2>
        <a href="#contact" class="btn">تواصل معي</a>
      </div>
    </section>

    <!-- ABOUT SECTION -->
    <section id="about">
      <h2 class="section-title">نبذة عني</h2>
      <div class="card">
        <p class="about-text">مطور ويب وباك اند لارفيل</p>
      </div>
    </section>

    <!-- SKILLS SECTION -->
    <section id="skills">
      <h2 class="section-title">المهارات</h2>
      <div class="grid">
        <div class="card">
          <h3>html</h3>
        </div>
        <div class="card">
          <h3>css</h3>
        </div>
        <div class="card">
          <h3>laravel</h3>
        </div>
      </div>
    </section>

    <!-- EXPERIENCE SECTION -->
    <section id="experience">
      <h2 class="section-title">الخبرات العملية</h2>
      <div class="grid">
        <div class="card">
          <h3>سنتين</h3>
        </div>
      </div>
    </section>

    <!-- EDUCATION SECTION -->
    <section id="education">
      <h2 class="section-title">التعليم</h2>
      <div class="grid">
        <div class="card">
          <h3>هندسة معلوماتية جامعة الجزيرة الخاصة</h3>
        </div>
      </div>
    </section>

    <!-- CONTACT SECTION -->
    <section id="contact">
      <h2 class="section-title">تواصل معي</h2>
      <div class="card">
        <p class="contact-info">٠٩٩٨٦٧٥٤٤</p>
      </div>
    </section>
  </div>

  <script>
    // Intersection Observer for scroll animations
    const observerOptions = {
      threshold: 0.1,
      rootMargin: '0px 0px -100px 0px'
    };

    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          entry.target.classList.add('visible');
        }
      });
    }, observerOptions);

    document.addEventListener('DOMContentLoaded', () => {
      document.querySelectorAll('section').forEach(section => {
        observer.observe(section);
      });
    });
  </script>
</body>
</html>
