<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>كمال القادري - مهندس معلوماتية</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;700;900&display=swap');
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Cairo', sans-serif;
            text-align: right;
            background: #050505;
            color: #FFFFFF;
            overflow-x: hidden;
            position: relative;
        }
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 20% 50%, rgba(0, 242, 254, 0.1) 0%, transparent 50%), 
                        radial-gradient(circle at 80% 80%, rgba(79, 172, 254, 0.1) 0%, transparent 50%);
            animation: moveOrbs 20s ease-in-out infinite;
            z-index: -1;
        }
        @keyframes moveOrbs {
            0%, 100% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(30px, -30px) scale(1.2); }
            66% { transform: translate(-30px, 30px) scale(0.8); }
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        header {
            background: rgba(25, 25, 25, 0.6);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 40px 0;
            margin-bottom: 60px;
        }
        .hero {
            text-align: center;
            margin-bottom: 60px;
        }
        .hero h1 {
            font-size: clamp(3rem, 8vw, 6rem);
            font-weight: 900;
            background: linear-gradient(45deg, #00F2FE, #4FACFE);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 20px;
            animation: glow 2s ease-in-out infinite alternate;
        }
        @keyframes glow {
            from { text-shadow: 0 0 10px rgba(0, 242, 254, 0.5); }
            to { text-shadow: 0 0 20px rgba(79, 172, 254, 0.8), 0 0 30px rgba(79, 172, 254, 0.6); }
        }
        .hero p {
            font-size: 1.5rem;
            color: #A1A1AA;
            margin-bottom: 30px;
        }
        .cta-button {
            display: inline-block;
            background: linear-gradient(45deg, #00F2FE, #4FACFE);
            color: #050505;
            padding: 15px 40px;
            font-size: 1.2rem;
            font-weight: 700;
            text-decoration: none;
            border-radius: 50px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 242, 254, 0.3);
        }
        .cta-button:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 25px rgba(0, 242, 254, 0.5);
        }
        .bento-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 30px;
            margin-bottom: 60px;
        }
        .bento-card {
            background: rgba(25, 25, 25, 0.6);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 30px;
            border-radius: 15px;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }
        .bento-card::before {
            content: '';
            position: absolute;
            top: 0;
            right: 0;
            width: 4px;
            height: 100%;
            background: linear-gradient(180deg, #00F2FE, #4FACFE);
        }
        .bento-card:hover {
            transform: translateY(-10px);
            border-color: rgba(0, 242, 254, 0.3);
            box-shadow: 0 10px 30px rgba(0, 242, 254, 0.2);
        }
        .bento-card h3 {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 15px;
            color: #00F2FE;
        }
        .bento-card p {
            color: #A1A1AA;
            line-height: 1.6;
        }
        .skills-list {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 15px;
        }
        .skill-tag {
            background: linear-gradient(45deg, #00F2FE, #4FACFE);
            color: #050505;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: 700;
        }
        .experience-item, .education-item {
            background: rgba(25, 25, 25, 0.6);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 25px;
            border-radius: 15px;
            margin-bottom: 20px;
            transition: all 0.3s ease;
        }
        .experience-item:hover, .education-item:hover {
            transform: translateY(-5px);
            border-color: rgba(0, 242, 254, 0.3);
        }
        .experience-item h4, .education-item h4 {
            font-size: 1.2rem;
            font-weight: 700;
            color: #00F2FE;
            margin-bottom: 10px;
        }
        .experience-item p, .education-item p {
            color: #A1A1AA;
            margin-bottom: 5px;
        }
        .contact-section {
            background: rgba(25, 25, 25, 0.6);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 40px;
            border-radius: 15px;
            text-align: center;
        }
        .contact-section h2 {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 20px;
            background: linear-gradient(45deg, #00F2FE, #4FACFE);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .contact-info {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-top: 30px;
            flex-wrap: wrap;
        }
        .contact-item {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.1rem;
            color: #A1A1AA;
        }
        .contact-item i {
            color: #00F2FE;
            font-size: 1.5rem;
        }
        @media (max-width: 768px) {
            .hero h1 {
                font-size: clamp(2rem, 6vw, 4rem);
            }
            .hero p {
                font-size: 1.2rem;
            }
            .bento-grid {
                grid-template-columns: 1fr;
            }
            .contact-info {
                flex-direction: column;
                align-items: center;
            }
        }
        ::-webkit-scrollbar {
            width: 10px;
        }
        ::-webkit-scrollbar-track {
            background: #050505;
        }
        ::-webkit-scrollbar-thumb {
            background: linear-gradient(45deg, #00F2FE, #4FACFE);
            border-radius: 5px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: linear-gradient(45deg, #4FACFE, #00F2FE);
        }
        .fade-in-up {
            opacity: 0;
            transform: translateY(30px);
            transition: all 0.6s ease;
        }
        .fade-in-up.visible {
            opacity: 1;
            transform: translateY(0);
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="hero">
                <h1>كمال القادري</h1>
                <p>مهندس معلوماتية</p>
                <p>مطور ويب وباك اند لارفيل</p>
                <a href="tel:٠٩٩٧٦٣٦٧٧٣" class="cta-button">تواصل معي</a>
            </div>
        </header>

        <section class="bento-grid">
            <div class="bento-card fade-in-up">
                <h3>المهارات</h3>
                <div class="skills-list">
                    <span class="skill-tag">HTML</span>
                    <span class="skill-tag">CSS</span>
                    <span class="skill-tag">Laravel</span>
                </div>
            </div>
            <div class="bento-card fade-in-up">
                <h3>الخبرة</h3>
                <div class="experience-item">
                    <h4>مطور ويب</h4>
                    <p>سنتين</p>
                </div>
            </div>
            <div class="bento-card fade-in-up">
                <h3>التعليم</h3>
                <div class="education-item">
                    <h4>هندسة معلوماتية</h4>
                    <p>جامعة الجزيرة الخاصة</p>
                    <p>2025</p>
                </div>
            </div>
        </section>

        <section class="contact-section fade-in-up">
            <h2>تواصل معي</h2>
            <div class="contact-info">
                <div class="contact-item">
                    <i class="fas fa-phone"></i>
                    <span>٠٩٩٧٦٣٦٧٧٣</span>
                </div>
            </div>
        </section>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const observerOptions = {
                threshold: 0.1,
                rootMargin: '0px 0px -50px 0px'
            };

            const observer = new IntersectionObserver(function(entries) {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        entry.target.classList.add('visible');
                    }
                });
            }, observerOptions);

            const fadeElements = document.querySelectorAll('.fade-in-up');
            fadeElements.forEach(el => {
                el.style.opacity = '0';
                el.style.transform = 'translateY(30px)';
                observer.observe(el);
            });
        });
    </script>
</body>
</html>
